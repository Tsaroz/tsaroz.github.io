name: Content poll

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: peek queue
        id: q
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          v=$(curl -s -H "apikey: $SUPABASE_SERVICE_KEY" -H "authorization: Bearer $SUPABASE_SERVICE_KEY" "$SUPABASE_URL/rest/v1/meta?select=value&key=eq.publish_requested")
          if echo "$v" | grep -q requested_at; then echo pending=true >> "$GITHUB_OUTPUT"; else echo pending=false >> "$GITHUB_OUTPUT"; exit 0; fi

      - uses: actions/checkout@v4
        if: steps.q.outputs.pending == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.q.outputs.pending == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.q.outputs.pending == 'true'

      - name: configure
        if: steps.q.outputs.pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: build and publish
        if: steps.q.outputs.pending == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_PANEL_URL: ${{ vars.PUBLIC_PANEL_URL }}
          PUBLISH_STRIP_PANEL: ${{ vars.PUBLISH_STRIP_PANEL }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEFAULT_BRANCH: main
          PAGES_BRANCH: gh-pages
        run: node scripts/publish.mjs

      - name: clear queue
        if: steps.q.outputs.pending == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -s -o /dev/null -X DELETE -H "apikey: $SUPABASE_SERVICE_KEY" -H "authorization: Bearer $SUPABASE_SERVICE_KEY" "$SUPABASE_URL/rest/v1/meta?key=eq.publish_requested"

